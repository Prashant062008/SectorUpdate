name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore SingaporeSectorUpdate.sln
      - run: dotnet build SingaporeSectorUpdate.sln -c Release --no-restore
      - run: dotnet publish SingaporeSectorUpdate/SingaporeSectorUpdate.csproj -c Release -o publish --no-build
      - run: dotnet test SingaporeSectorUpdate.sln -c Release --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: SingaporeSectorUpdate
          path: publish